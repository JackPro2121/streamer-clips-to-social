name: Streamer Viral Clips to Social (V2)

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: 'YouTube Stream/VOD URL (Leave blank to auto-discover latest stream)'
        required: false
        default: ''
        type: string
      streamer:
        description: 'Target Streamer for Auto-Discovery'
        required: false
        default: 'all'
        type: choice
        options:
          - 'all'
          - 'kai_cenat'
          - 'ishowspeed'
          - 'jynxzi'
          - 'caseoh'
          - 'xqc'
          - 'adin_ross'
      num_clips:
        description: 'Number of viral clips to extract (1 to 5)'
        required: true
        default: '3'
        type: choice
        options:
          - '1'
          - '2'
          - '3'
          - '4'
          - '5'
      post_to_buffer:
        description: 'Post to Streamer Buffer Queue (Isolated - Requires STREAMER_BUFFER_ACCESS_TOKEN)'
        required: false
        default: false
        type: boolean
      delay_days:
        description: 'Days to delay posting on Buffer (e.g. 3 or 4 for account warm-up, 0 for immediate queue)'
        required: false
        default: '0'
        type: string

permissions:
  contents: write

concurrency:
  group: streamer-clipper-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  clip-streamers:
    name: Clip Streamers & Generate Shorts (V2)
    if: github.repository == 'JackPro2121/streamer-clips-to-social'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install System Dependencies (FFmpeg & Fonts)
        run: |
          if ! command -v ffmpeg &> /dev/null; then
            sudo apt-get update -o Acquire::Retries=3 -o Acquire::http::Timeout="15" -qq || true
            sudo apt-get install -y -qq ffmpeg libgl1 libglib2.0-0 || true
          fi
          sudo apt-get update -o Acquire::Retries=3 -o Acquire::http::Timeout="15" -qq || true
          sudo apt-get install -y -qq fonts-montserrat fonts-noto-color-emoji || true
          ffmpeg -version | head -n 1

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run V2 Streamer Clipper
        env:
          PYTHONUNBUFFERED: '1'
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          GEMINI_API_KEY_4: ${{ secrets.GEMINI_API_KEY_4 }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          APIFY_API_TOKEN: ${{ secrets.APIFY_API_TOKEN }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
          # Dedicated Streamer Buffer Credentials (isolated from Podcast Buffer)
          STREAMER_BUFFER_ACCESS_TOKEN: ${{ secrets.STREAMER_BUFFER_ACCESS_TOKEN }}
          STREAMER_BUFFER_CHANNEL_IDS: ${{ secrets.STREAMER_BUFFER_CHANNEL_IDS }}
          STREAMER_WATERMARK: ${{ secrets.STREAMER_WATERMARK || '@streamersclips' }}
          MAX_CLIP_DURATION: '45'
          SHORT_FORM_MAX_DURATION: '50'
          STREAMER_MIN_CLIP_DURATION: '30'
          STREAMER_MAX_CLIP_DURATION: '45'
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          # SECURITY: dispatch inputs are bridged through env and dereferenced as
          # quoted shell variables. Never interpolate ${{ github.event.inputs.* }}
          # into the script body — GitHub expands it before bash parses the line,
          # which makes free-text inputs a script-injection sink in a job that
          # holds the Buffer publish token and a contents:write GITHUB_TOKEN.
          INPUT_VIDEO_URL: ${{ github.event.inputs.video_url }}
          INPUT_STREAMER: ${{ github.event.inputs.streamer }}
          INPUT_NUM_CLIPS: ${{ github.event.inputs.num_clips }}
          INPUT_POST_TO_BUFFER: ${{ github.event.inputs.post_to_buffer }}
          INPUT_DELAY_DAYS: ${{ github.event.inputs.delay_days }}
        run: |
          args=()
          [ -n "$INPUT_VIDEO_URL" ] && args+=(--video-url "$INPUT_VIDEO_URL")
          [ "$INPUT_STREAMER" != "all" ] && args+=(--streamer "$INPUT_STREAMER")
          args+=(--num-clips "${INPUT_NUM_CLIPS:-3}")
          [ "$INPUT_POST_TO_BUFFER" = "true" ] && args+=(--post-to-buffer)
          [ -n "$INPUT_DELAY_DAYS" ] && args+=(--delay-days "$INPUT_DELAY_DAYS")

          python -u main_streamer.py "${args[@]}"

      - name: Persist Streamer Video History & Cursor
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/streamer_history.json data/streamer_cursor.json || true
          if ! git diff --staged --quiet; then
            git commit -m "chore(history): update processed streamer VODs and round-robin cursor [skip ci]"
            git pull --rebase origin main || true
            git push origin main || echo "History push skipped"
          fi

      - name: Upload Streamer Gate Verdicts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: streamer-gate-verdicts
          path: data/runs/
          retention-days: 14

      - name: Upload Streamer Clips as Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: streamer-viral-clips
          path: clips/streamers/
          retention-days: 14

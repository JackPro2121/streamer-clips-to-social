name: V2 Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v2-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Pytest (V2 + shared engine)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install system dependencies (FFmpeg & fonts)
        run: |
          sudo apt-get update -o Acquire::Retries=3 -o Acquire::http::Timeout="15" -qq || true
          sudo apt-get install -y -qq ffmpeg libgl1 libglib2.0-0 fonts-montserrat fonts-noto-color-emoji || true
          ffmpeg -version | head -n 1

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      # Lint V2-owned code only. `core/` is the vendored clips-core engine and
      # must stay byte-identical to upstream (see SYNC.md), so style changes
      # there have to land upstream and be pulled in — never fixed here.
      #
      # The rule set is deliberately the "real bug" class rather than a full
      # style pass: E9/F63/F7/F82 are syntax and name errors, F401/F811/F841/F501
      # are unused/dead/storetyping mistakes. A broad style gate would fail on
      # ~21k lines of pre-existing code and get disabled, which is worse than no
      # gate at all.
      - name: Lint (ruff — bug-class rules)
        run: |
          python -m ruff check \
            --select E9,F63,F7,F82,F401,F811,F841,F501 \
            streamers/ main_streamer.py tests/

      # Coverage floor for the V2-owned surface (`streamers/`). `core/` is the
      # vendored engine: it is verified upstream and identical here, so gating
      # this repo on it would just create pressure to edit vendored code.
      #
      # 45 is a ratchet, not a target. It is set a few points below the measured
      # value so honest refactors do not trip it, while a genuine regression in
      # test coverage does. The ECC standard is 80%; reaching it here needs real
      # media for gate.py and pipeline.py, which the tests/fixtures corpus is for
      # (see tests/test_v2_gate_e2e.py) — raise this floor as that corpus grows.
      - name: Run test suite (with coverage floor)
        env:
          PYTHONUNBUFFERED: '1'
        run: |
          python -m pytest tests/ -q \
            --cov=streamers \
            --cov-report=term-missing \
            --cov-fail-under=45
